name: Validate

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax and unit tests
        run: npm run check
  windows-check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax and unit tests
        run: npm run check
      - name: Build unpacked Windows app
        run: npm run desktop:dir
      - name: Build Windows NSIS installer
        run: npm run desktop:installer
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Council-Room-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
