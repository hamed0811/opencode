name: Validate

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  electron-lockfile:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve Electron lockfile without install scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile on feature pushes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh Electron 45 lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: Electron-45-Lockfile
          path: package-lock.json
          retention-days: 2
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit report
        continue-on-error: true
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log('AUDIT SUMMARY', JSON.stringify(a.metadata?.vulnerabilities || {})); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:(v.via || []).map(x => typeof x === 'string' ? x : {title:x.title,url:x.url,range:x.range})}));"
      - name: Syntax and unit tests
        run: npm run check
  windows-check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check sandbox preflight script syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/check-sandbox-prerequisites.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
      - name: Syntax and unit tests
        run: npm run check
      - name: Build unpacked Windows app
        run: npm run desktop:dir
      - name: Build Windows NSIS installer
        run: npm run desktop:installer
      - name: Generate SHA-256 checksums
        shell: powershell
        run: |
          $files = Get-ChildItem -Path dist -Filter *.exe -File
          if (-not $files) { throw "No Windows executable artifacts were created." }
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($file.Name)"
          }
          $lines | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Council-Room-Windows-Installer
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
