name: Runtime Foundation Checks

on:
  push:
    branches: [agent-runtime-foundation]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check desktop JavaScript syntax
        run: node --check desktop/main.cjs && node --check desktop/preload.cjs && node --check app.js
      - name: Run runtime foundation tests
        run: node --test runtime/tests/*.test.cjs
