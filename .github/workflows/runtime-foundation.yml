name: Runtime Foundation Checks

on:
  push:
    branches: [agent-runtime-foundation]
  pull_request:
    branches: [agent-runtime-foundation]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run runtime foundation tests
        run: node --test runtime/tests/*.test.cjs
